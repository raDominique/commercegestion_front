name: Deploy Etokisana

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PORT: "4242"
  DOCKER_IMAGE: commercegestion
  DOCKER_CONTAINER_NAME: commercegestion
  DOCKER_BUILDKIT: "1"
  NODE_ENV: production
  VITE_API_BASE_URL: https://api.commercegestion.online
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG: ${{ github.run_number }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - name: Deploy on server with rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          PORT: ${{ env.PORT }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          DOCKER_CONTAINER_NAME: ${{ env.DOCKER_CONTAINER_NAME }}
          REPOSITORY_URL: ${{ env.REPOSITORY_URL }}
          NODE_ENV: ${{ env.NODE_ENV }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ env.VITE_GOOGLE_MAPS_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PORT,DOCKER_IMAGE,DOCKER_TAG,DOCKER_CONTAINER_NAME,REPOSITORY_URL,NODE_ENV,VITE_API_BASE_URL,VITE_GOOGLE_MAPS_API_KEY
          script: |
            set -e
            APP_DIR=/home/${{ secrets.SSH_USER }}/commercgestion/commercegestion_front
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" pull --ff-only origin main
            else
              git clone --branch main --single-branch "$REPOSITORY_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            docker build -t "$DOCKER_IMAGE:$DOCKER_TAG" .

            if docker ps -a --format '{{.Names}}' | grep -qx "$DOCKER_CONTAINER_NAME"; then
              docker rm -f "${DOCKER_CONTAINER_NAME}_backup" 2>/dev/null || true
              docker stop "$DOCKER_CONTAINER_NAME" || true
              docker rename "$DOCKER_CONTAINER_NAME" "${DOCKER_CONTAINER_NAME}_backup"
            fi

            docker volume create "${DOCKER_CONTAINER_NAME}_upload" >/dev/null

            docker run -d \
              --name "$DOCKER_CONTAINER_NAME" \
              --restart unless-stopped \
              --memory=4g \
              --memory-reservation=2g \
              --cpus=4 \
              --pids-limit=200 \
              -p "$PORT:$PORT" \
              -e PORT \
              -e VITE_API_BASE_URL \
              -e VITE_GOOGLE_MAPS_API_KEY \
              -e NODE_ENV \
              "$DOCKER_IMAGE:$DOCKER_TAG"

            sleep 15

            if docker ps --format '{{.Names}}' | grep -qx "$DOCKER_CONTAINER_NAME"; then
              docker rm -f "${DOCKER_CONTAINER_NAME}_backup" 2>/dev/null || true
            else
              docker rm -f "$DOCKER_CONTAINER_NAME" 2>/dev/null || true
              if docker ps -a --format '{{.Names}}' | grep -qx "${DOCKER_CONTAINER_NAME}_backup"; then
                docker rename "${DOCKER_CONTAINER_NAME}_backup" "$DOCKER_CONTAINER_NAME"
                docker start "$DOCKER_CONTAINER_NAME"
              fi
              exit 1
            fi

            docker image prune -a -f || true
