server {
    listen 4242;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Transmet les appels API au backend (l'URI /api/... est conservée).
    location ^~ /api {
        proxy_pass https://api.commercegestion.online;
        proxy_ssl_server_name on;

        proxy_set_header Host api.commercegestion.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA React/Vite
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      text/xml
      application/xml
      application/xml+rss
      text/javascript;
}
